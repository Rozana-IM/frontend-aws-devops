<!DOCTYPE html>
<html>

<head>

<body>

<div id="navbar"></div>

<section class="cart-page">

<script>
  fetch("components/navbar.html")
.then(res => res.text())
.then(data => {
  document.getElementById("navbar").innerHTML = data;

  if(typeof initNavbar === "function"){
    initNavbar();
  }
});
</script>
