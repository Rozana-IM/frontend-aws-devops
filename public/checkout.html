<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<title>LUCCI Checkout</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div id="navbar"></div>

<section class="checkout-page">

<h2>Checkout</h2>

<div class="checkout-container">

<!-- CART SUMMARY -->

<div class="checkout-cart">

<h3>Order Summary</h3>

<div id="checkoutItems"></div>

<h3 id="checkoutTotal"></h3>

</div>

<!-- ADDRESS FORM -->

<div class="checkout-address">

<h3>Delivery Address</h3>

<form id="addressForm">

<input type="text" id="full_name" placeholder="Full Name" required>
<input type="text" id="phone" placeholder="Phone Number" required>
<input type="text" id="address_line1" placeholder="Address Line 1" required>
<input type="text" id="address_line2" placeholder="Address Line 2">
<input type="text" id="city" placeholder="City" required>
<input type="text" id="state" placeholder="State" required>
<input type="text" id="pincode" placeholder="Pincode" required>

  <div class="payment-method">

<h3>Select Payment Method</h3>

<label>
<input type="radio" name="paymentMethod" value="razorpay" checked>
Razorpay (UPI / Card / Netbanking)
</label>

<label>
<input type="radio" name="paymentMethod" value="paytm">
Paytm Wallet
</label>

</div>
<button type="submit">Place Order</button>

</form>

</div>

</div>

</section>

<script src="../src/navbar.js"></script>
<script src="checkout.js"></script>
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>  

</body>

</html>
