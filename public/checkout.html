<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LUCCI | Checkout</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

<!-- NAVBAR -->
<div id="navbar"></div>

<section class="checkout-page">

<h2>Checkout</h2>

<div class="checkout-container">

  <!-- LEFT -->
  <div class="checkout-left">
    <div class="checkout-cart">
      <h3>Order Summary</h3>
      <div id="checkoutItems"></div>
      <h3 id="checkoutTotal"></h3>
    </div>
  </div>

  <!-- RIGHT -->
  <div class="checkout-right">

    <div class="checkout-address">
      <h3>Delivery Address</h3>

      <div id="selectedAddressBox"></div>

      <div class="address-actions">
        <button onclick="showAddressForm()">+ Add Address</button>
        <button onclick="toggleAddressList()">Choose Address</button>
      </div>

      <div id="addressList" style="display:none;"></div>

      <form id="addressForm" style="display:none;">
        <input type="text" id="full_name" placeholder="Full Name">
        <input type="tel" id="phone" placeholder="Phone">
        <input type="text" id="address_line1" placeholder="Address">
        <input type="text" id="address_line2" placeholder="Address Line 2 (optional)">
        <input type="text" id="city" placeholder="City">
        <input type="text" id="state" placeholder="State">
        <input type="text" id="pincode" placeholder="Pincode">
      </form>
    </div>

    <div class="payment-method">
      <h3>Select Payment Method</h3>
      <label><input type="radio" name="paymentMethod" value="razorpay" checked> Razorpay</label>
      <label><input type="radio" name="paymentMethod" value="paytm"> Paytm</label>
      <label><input type="radio" name="paymentMethod" value="cod"> COD</label>
    </div>

    <button id="placeOrderBtn" class="place-order-btn">
      Place Order
    </button>

  </div>

</div>
</section>

<script src="https://checkout.razorpay.com/v1/checkout.js"></script>

<script src="/src/app.js"></script>
<script src="/src/navbar.js"></script>
<script src="/src/checkout.js"></script>

<script>
fetch("components/navbar.html")
.then(res => res.text())
.then(data => {
  document.getElementById("navbar").innerHTML = data;
  if(typeof initNavbar === "function") initNavbar();
});
</script>

</body>
</html>
