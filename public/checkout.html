<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LUCCI | Checkout</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<!-- NAVBAR -->
<div id="navbar"></div>

<section class="checkout-page">

<h2>Checkout</h2>

<div class="checkout-container">

<!-- ================= CART SUMMARY ================= -->

<div class="checkout-cart">

<h3>Order Summary</h3>

<div id="checkoutItems"></div>

<h3 id="checkoutTotal"></h3>

</div>


<!-- ================= ADDRESS FORM ================= -->

<div class="checkout-address">

<h3>Delivery Address</h3>

<form id="addressForm">

<input type="text" id="full_name" placeholder="Full Name" required>

<input type="tel" id="phone" placeholder="Phone Number" required>

<input type="text" id="address_line1" placeholder="Address Line 1" required>

<input type="text" id="address_line2" placeholder="Address Line 2">

<input type="text" id="city" placeholder="City" required>

<input type="text" id="state" placeholder="State" required>

<input type="text" id="pincode" placeholder="Pincode" required>

<!-- ================= PAYMENT METHOD ================= -->

<div class="payment-method">

<h3>Select Payment Method</h3>

<label>
<input type="radio" name="paymentMethod" value="razorpay" checked>
Razorpay (UPI / Card / Netbanking / PhonePe / GPay)
</label>

<label>
<input type="radio" name="paymentMethod" value="paytm">
Paytm Wallet
</label>
<label>
  <input type="radio" name="paymentMethod" value="cod"> Cash on Delivery
</label>
</div>

<button type="submit" class="place-order-btn">
Place Order
</button>

</form>

</div>

</div>

</section>

<!-- ================= SCRIPTS ================= -->

<script src="https://checkout.razorpay.com/v1/checkout.js"></script>

<script src="/src/navbar.js"></script>
<script src="/src/checkout.js"></script>

<script>

fetch("components/navbar.html")
.then(res => res.text())
.then(data => {
document.getElementById("navbar").innerHTML = data
initNavbar()
})

</script>

</body>
</html>
