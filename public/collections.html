<!DOCTYPE html>
<html>
<head>
<title>Collections</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<h2 id="title"></h2>

<div id="products" class="hero-products"></div>

<script>

const API="https://api.rozana-projects.online";

const params=new URLSearchParams(window.location.search);
const category=params.get("cat");

console.log("Category:", category);

/* Safety check */
if(!category){
document.getElementById("title").innerText="Collection";
return;
}

document.getElementById("title").innerText=
category.toUpperCase()+" COLLECTION";

fetch(`${API}/products?category=${category}`)
.then(res=>res.json())
.then(data=>renderProducts(data));

function renderProducts(products){

const container=document.getElementById("products");

container.innerHTML+=`

<div class="product-card">

<div class="product-img-wrapper">
<img src="${p.image_url}" class="product-img">
</div>

<div class="product-info">
<h3>${p.name}</h3>
<p class="price">₹${p.price}</p>

<div class="product-actions">
<button onclick="viewProduct(${p.id})">View</button>
<button onclick="addWishlist(${p.id})">♡</button>
</div>

</div>

</div>
`;

});

}

function viewProduct(id){
window.location=`product-details.html?id=${id}`;
}

function addWishlist(id){

let list=JSON.parse(localStorage.getItem("wishlist"))||[];

if(!list.includes(id)){
list.push(id);
}

localStorage.setItem("wishlist",JSON.stringify(list));

alert("Added to wishlist");

}

</script>
</body>
</html>
