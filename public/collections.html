<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<title>LUCCI Collections</title>

<link rel="stylesheet" href="style.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>

<body>

<!-- NAVBAR -->
<div id="navbar"></div>

<section class="collection-page">

<h2 id="title" class="collection-title"></h2>

<div id="products" class="products-grid"></div>

</section>

<!-- ✅ REQUIRED SCRIPTS -->
<script src="src/app.js"></script>
<script src="src/navbar.js"></script>

<script>

const API = "https://api.rozana-projects.online";

/* ================= NAVBAR ================= */

fetch("components/navbar.html")
.then(res => res.text())
.then(data => {
  document.getElementById("navbar").innerHTML = data;

  if(typeof initNavbar === "function"){
    initNavbar();
  }
});

/* ================= GET CATEGORY ================= */

const params = new URLSearchParams(window.location.search);
const category = params.get("cat");

const titleEl = document.getElementById("title");

/* ================= PAGE TITLE ================= */

if(!category){
  titleEl.innerText = "Collection";
} else {

  titleEl.innerText = category.toUpperCase() + " COLLECTION";

  /* ================= FETCH PRODUCTS ================= */

  apiRequest(`${API}/products/category/${category}`)
    .then(data => {

      console.log("PRODUCT DATA:", data); // 🔥 debug

      if (!Array.isArray(data)) {
        console.error("Invalid data:", data);
        return;
      }

      renderProducts(data);
    })
    .catch(err => console.error("FETCH ERROR:", err));
}

/* ================= RENDER PRODUCTS ================= */

function renderProducts(products){

  const container = document.getElementById("products");

  if(!container){
    console.error("Products container not found");
    return;
  }

  container.innerHTML = "";

  if(products.length === 0){
    container.innerHTML = "<p>No products found</p>";
    return;
  }

  products.forEach(p => {

    let wishlist = JSON.parse(localStorage.getItem("wishlist")) || [];

    let heart = wishlist.includes(p.id)
      ? '<i class="fa-solid fa-heart"></i>'
      : '<i class="fa-regular fa-heart"></i>';

    const card = document.createElement("div");
    card.className = "product-card";

    card.innerHTML = `
      <img src="${p.image_url}" class="product-img" />

      <div class="product-info">
        <h3>${p.name}</h3>
        <p class="price">₹${p.price}</p>

        <div class="product-actions">
          <button onclick="viewProduct(${p.id})">View</button>

          <button class="wishlist-btn"
            onclick="toggleWishlist(${p.id}, this)">
            ${heart}
          </button>
        </div>
      </div>
    `;

    container.appendChild(card);
  });
}

/* ================= VIEW PRODUCT ================= */

function viewProduct(id){
  window.location = `product-details.html?id=${id}`;
}

/* ================= WISHLIST ================= */

function toggleWishlist(id, btn){

  let list = JSON.parse(localStorage.getItem("wishlist")) || [];

  let index = list.indexOf(id);

  if(index === -1){
    list.push(id);
    btn.innerHTML = '<i class="fa-solid fa-heart"></i>';
  } else {
    list.splice(index,1);
    btn.innerHTML = '<i class="fa-regular fa-heart"></i>';
  }

  localStorage.setItem("wishlist", JSON.stringify(list));
}

</script>

</body>
</html>
