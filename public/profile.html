<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login / Signup | LUCCI</title>
  <link rel="stylesheet" href="style.css">

  <style>
    :root {
      --bg: #f5f5f5;
      --card: #ffffff;
      --text: #1c2b33;
      --border: #ccc;
    }

    body.dark {
      --bg: #0f172a;
      --card: #111827;
      --text: #e5e7eb;
      --border: #374151;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, sans-serif;
    }

    .auth-box {
      width: 380px;
      background: var(--card);
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.15);
    }

    h2 {
      text-align: center;
      margin-bottom: 10px;
    }

    .username {
      text-align: center;
      font-size: 14px;
      margin-bottom: 15px;
      color: #4f46e5;
    }

    input {
      width: 100%;
      padding: 10px;
      margin-bottom: 12px;
      border-radius: 4px;
      border: 1px solid var(--border);
      background: transparent;
      color: inherit;
    }

    button {
      width: 100%;
      padding: 12px;
      background: linear-gradient(to right, #1c2b33, #243b55);
      color: white;
      border: none;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 5px;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    hr {
      margin: 25px 0;
      border: none;
      border-top: 1px solid var(--border);
    }

    .msg {
      text-align: center;
      margin-top: 15px;
      color: red;
      font-size: 14px;
    }

    .dark-toggle {
      text-align: center;
      margin-top: 15px;
      cursor: pointer;
      font-size: 13px;
      color: #6366f1;
    }
  </style>
</head>
<body>

<div class="auth-box">
  <h2>Create Account / Login</h2>
  <div class="username" id="loggedUser"></div>

  <!-- SIGN UP -->
  <input id="regName" placeholder="Name">
  <input id="regEmail" placeholder="Email">
  <input id="regPassword" type="password" placeholder="Password">
  <button id="signupBtn" onclick="register()">SIGN UP</button>

  <hr>

  <!-- LOGIN -->
  <input id="loginEmail" placeholder="Email">
  <input id="loginPassword" type="password" placeholder="Password">
  <button id="loginBtn" onclick="login()">LOGIN</button>

  <div class="msg" id="msg"></div>
  <div class="dark-toggle" onclick="toggleDarkMode()">🌙 Toggle Dark Mode</div>
</div>

<script src="../src/app.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", () => {

    // show logged user if exists
    const user = getUser();
    if (user) {
      document.getElementById("loggedUser").innerText =
        `Logged in as ${user.name}`;
    }

    // dark mode init
    if (localStorage.getItem("theme") === "dark") {
      document.body.classList.add("dark");
    }

    window.toggleDarkMode = () => {
      document.body.classList.toggle("dark");
      localStorage.setItem(
        "theme",
        document.body.classList.contains("dark") ? "dark" : "light"
      );
    };

    // SIGN UP
    window.register = async function () {
      const btn = signupBtn;
      btn.disabled = true;
      btn.innerText = "Signing up...";
      msg.innerText = "";

      try {
        const res = await fetch(`${API_BASE_URL}/register`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            name: regName.value,
            email: regEmail.value,
            password: regPassword.value,
          }),
        });

        const data = await res.json();
        if (!res.ok) {
          msg.innerText = data.error || "Signup failed";
          return;
        }

        localStorage.setItem("user", JSON.stringify(data.user));
        localStorage.setItem("token", data.token);
        localStorage.setItem("refreshToken", data.refreshToken);
        window.location.href = "index.html";
      } finally {
        btn.disabled = false;
        btn.innerText = "SIGN UP";
      }
    };

    // LOGIN
    window.login = async function () {
      const btn = loginBtn;
      btn.disabled = true;
      btn.innerText = "Logging in...";
      msg.innerText = "";

      try {
        const res = await fetch(`${API_BASE_URL}/login`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            email: loginEmail.value,
            password: loginPassword.value,
          }),
        });

        const data = await res.json();
        if (!res.ok) {
          msg.innerText = data.error || "Invalid login";
          return;
        }

        localStorage.setItem("user", JSON.stringify(data.user));
        localStorage.setItem("token", data.token);
        localStorage.setItem("refreshToken", data.refreshToken);
        window.location.href = "index.html";
      } finally {
        btn.disabled = false;
        btn.innerText = "LOGIN";
      }
    };
  });
</script>

</body>
</html>
