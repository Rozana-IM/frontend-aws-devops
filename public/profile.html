<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login / Signup | LUCCI</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .auth-box {
      max-width: 400px;
      margin: 80px auto;
      background: white;
      padding: 30px;
      border-radius: 6px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.15);
    }
    .auth-box h2 {
      text-align: center;
      margin-bottom: 20px;
    }
    .auth-box input {
      width: 100%;
      padding: 10px;
      margin-bottom: 12px;
    }
    .auth-box button {
      width: 100%;
      padding: 10px;
      margin-bottom: 10px;
      background: #ff3f6c;
      color: white;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }
    .msg {
      text-align: center;
      font-size: 14px;
      margin-top: 10px;
      color: red;
    }
  </style>
</head>
<body>

<div class="auth-box">
  <h2>Create Account / Login</h2>

  <!-- SIGN UP -->
  <div>
    <input id="regName" placeholder="Name">
    <input id="regEmail" placeholder="Email">
    <input id="regPassword" type="password" placeholder="Password">
    <button onclick="register()">SIGN UP</button>
  </div>

  <hr>

  <!-- LOGIN -->
  <div>
    <input id="loginEmail" placeholder="Email">
    <input id="loginPassword" type="password" placeholder="Password">
    <button onclick="login()">LOGIN</button>
  </div>

  <div class="msg" id="msg"></div>
</div>

<script>
const API_BASE_URL = "https://api.rozana-projects.online";

// ================= SIGN UP (AUTO LOGIN) =================
async function register() {
  const name = regName.value;
  const email = regEmail.value;
  const password = regPassword.value;
  const msg = document.getElementById("msg");

  if (!name || !email || !password) {
    msg.innerText = "All fields required";
    return;
  }

  try {
    const res = await fetch(`${API_BASE_URL}/register`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name, email, password })
    });

    const data = await res.json();

    // user already exists
    if (res.status === 409) {
      msg.innerText = "Account already exists. Please login.";
      return;
    }

    if (!res.ok) {
      msg.innerText = data.error || "Signup failed";
      return;
    }

    // ✅ SIGNUP = LOGIN
    localStorage.setItem("user", JSON.stringify(data.user));
    window.location.href = "index.html";

  } catch (err) {
    console.error(err);
    msg.innerText = "Server error";
  }
}

// ================= LOGIN =================
async function login() {
  const email = loginEmail.value;
  const password = loginPassword.value;
  const msg = document.getElementById("msg");

  if (!email || !password) {
    msg.innerText = "Email and password required";
    return;
  }

  try {
    const res = await fetch(`${API_BASE_URL}/login`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email, password })
    });

    const data = await res.json();

    if (!res.ok || data.error) {
      msg.innerText = "Invalid email or password";
      return;
    }

    localStorage.setItem("user", JSON.stringify(data.user));
    window.location.href = "index.html";

  } catch (err) {
    console.error(err);
    msg.innerText = "Server error";
  }
}
</script>

</body>
</html>
