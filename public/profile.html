<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login / Signup | LUCCI</title>
  <link rel="stylesheet" href="style.css">

  <style>
    /* ===== THEME VARIABLES ===== */
    :root {
      --bg-color: #f5f5f5;
      --card-bg: #ffffff;
      --text-color: #1c2b33;
      --input-bg: #ffffff;
      --border-color: #ccc;
    }

    body.dark {
      --bg-color: #0f172a;
      --card-bg: #111827;
      --text-color: #e5e7eb;
      --input-bg: #1f2933;
      --border-color: #374151;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: var(--bg-color);
      font-family: Arial, sans-serif;
      color: var(--text-color);
      transition: background 0.3s ease;
    }

    .auth-box {
      width: 380px;
      background: var(--card-bg);
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.15);
    }

    .auth-box h2 {
      text-align: center;
      margin-bottom: 10px;
    }

    .username {
      text-align: center;
      font-size: 14px;
      margin-bottom: 15px;
      color: #4f46e5;
    }

    .auth-box input {
      width: 100%;
      padding: 10px;
      margin-bottom: 12px;
      border-radius: 4px;
      border: 1px solid var(--border-color);
      background: var(--input-bg);
      color: var(--text-color);
      font-size: 14px;
    }

    .auth-box button {
      width: 100%;
      padding: 12px;
      margin-top: 5px;
      background: linear-gradient(to right, #1c2b33, #243b55);
      color: white;
      border: none;
      border-radius: 4px;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
      transition: opacity 0.2s ease, transform 0.1s ease;
    }

    .auth-box button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .auth-box button:hover:not(:disabled) {
      opacity: 0.95;
      transform: translateY(-1px);
    }

    .auth-box hr {
      margin: 25px 0;
      border: none;
      border-top: 1px solid var(--border-color);
    }

    .msg {
      text-align: center;
      margin-top: 15px;
      font-size: 14px;
      color: red;
    }

    .dark-toggle {
      text-align: center;
      margin-top: 15px;
      font-size: 13px;
      cursor: pointer;
      color: #6366f1;
    }
  </style>
</head>
<body>

<div class="auth-box">
  <h2>Create Account / Login</h2>

  <div class="username" id="loggedUser"></div>

  <!-- SIGN UP -->
  <input id="regName" placeholder="Name">
  <input id="regEmail" placeholder="Email">
  <input id="regPassword" type="password" placeholder="Password">
  <button id="signupBtn" onclick="register()">SIGN UP</button>

  <hr>

  <!-- LOGIN -->
  <input id="loginEmail" placeholder="Email">
  <input id="loginPassword" type="password" placeholder="Password">
  <button id="loginBtn" onclick="login()">LOGIN</button>

  <div class="msg" id="msg"></div>

  <div class="dark-toggle" onclick="toggleDarkMode()">
    🌙 Toggle Dark Mode
  </div>
</div>

<script src="../src/app.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", () => {

    /* ===== SHOW LOGGED IN USER ===== */
    const user = getUser();
    const loggedUser = document.getElementById("loggedUser");

    if (user) {
      loggedUser.innerText = `Logged in as ${user.name}`;
    }

    /* ===== DARK MODE INIT ===== */
    if (localStorage.getItem("theme") === "dark") {
      document.body.classList.add("dark");
    }

    window.toggleDarkMode = function () {
      document.body.classList.toggle("dark");
      localStorage.setItem(
        "theme",
        document.body.classList.contains("dark") ? "dark" : "light"
      );
    };

    /* ===== SIGN UP ===== */
    window.register = async function () {
      const btn = document.getElementById("signupBtn");
      btn.disabled = true;
      btn.innerText = "Signing up...";

      const name = regName.value;
      const email = regEmail.value;
      const password = regPassword.value;
      const msg = document.getElementById("msg");

      try {
        const res = await fetch(`${USER_SERVICE_URL}/register`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name, email, password }),
        });

        const data = await res.json();
        if (!res.ok) {
          msg.innerText = data.error || "Signup failed";
          return;
        }

        localStorage.setItem("user", JSON.stringify(data.user));
        localStorage.setItem("token", data.token);
        window.location.href = "index.html";
      } finally {
        btn.disabled = false;
        btn.innerText = "SIGN UP";
      }
    };

    /* ===== LOGIN ===== */
    window.login = async function () {
      const btn = document.getElementById("loginBtn");
      btn.disabled = true;
      btn.innerText = "Logging in...";

      const email = loginEmail.value;
      const password = loginPassword.value;
      const msg = document.getElementById("msg");

      try {
        const res = await fetch(`${USER_SERVICE_URL}/login`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password }),
        });

        const data = await res.json();
        if (!res.ok) {
          msg.innerText = data.error || "Invalid email or password";
          return;
        }

        localStorage.setItem("user", JSON.stringify(data.user));
        localStorage.setItem("token", data.token);
        window.location.href = "index.html";
      } finally {
        btn.disabled = false;
        btn.innerText = "LOGIN";
      }
    };

  });
</script>

</body>
</html>
