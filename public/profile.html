<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login / Signup | LUCCI</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .auth-box {
      max-width: 400px;
      margin: 80px auto;
      background: white;
      padding: 30px;
      border-radius: 6px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.15);
    }

    .auth-box h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    .auth-box input {
      width: 100%;
      padding: 10px;
      margin-bottom: 12px;
    }

    .auth-box button {
      width: 100%;
      padding: 10px;
      margin-bottom: 10px;
      background: #ff3f6c;
      color: white;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }

    .msg {
      text-align: center;
      font-size: 14px;
      margin-top: 10px;
      color: red;
    }
  </style>
</head>
<body>

<div class="auth-box">
  <h2 id="title">Login</h2>

  <!-- SIGN UP -->
  <div id="signupBox">
    <input id="regName" placeholder="Name">
    <input id="regEmail" placeholder="Email">
    <input id="regPassword" type="password" placeholder="Password">
    <button onclick="register()">SIGN UP</button>
  </div>

  <!-- LOGIN -->
  <div id="loginBox">
    <input id="loginEmail" placeholder="Email">
    <input id="loginPassword" type="password" placeholder="Password">
    <button onclick="login()">LOGIN</button>
  </div>

  <div class="msg" id="msg"></div>
</div>

<script>
const API_BASE_URL = "http://api.rozana-projects.online";

// hide signup if already logged in
const existingUser = localStorage.getItem("user");
if (existingUser) {
  document.getElementById("signupBox").style.display = "none";
  document.getElementById("title").innerText = "Welcome Back";
}

// ================= SIGN UP =================
async function register() {
  console.log("Register button clicked");

  const name = document.getElementById("regName").value;
  const email = document.getElementById("regEmail").value;
  const password = document.getElementById("regPassword").value;
  const msg = document.getElementById("msg");

  if (!name || !email || !password) {
    msg.innerText = "All fields required";
    return;
  }

  try {
    const res = await fetch(`${API_BASE_URL}/register`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name, email, password })
    });

    const data = await res.json();
    console.log("Register response:", data);

    if (!res.ok || data.error) {
      msg.innerText = data.error || "Registration failed";
      return;
    }

    msg.style.color = "green";
    msg.innerText = "Signup successful. Please login.";

  } catch (error) {
    console.error("Register error:", error);
    msg.innerText = "Server error";
  }
}

// ================= LOGIN =================
async function login() {
  const email = document.getElementById("loginEmail").value;
  const password = document.getElementById("loginPassword").value;
  const msg = document.getElementById("msg");

  if (!email || !password) {
    msg.innerText = "Enter email and password";
    return;
  }

  try {
    const res = await fetch(`${API_BASE_URL}/login`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email, password })
    });

    const data = await res.json();

    if (!res.ok || data.error) {
      msg.innerText = "Create an account first";
      return;
    }

    localStorage.setItem("user", JSON.stringify(data.user));
    window.location.href = "index.html";

  } catch (error) {
    console.error("Login error:", error);
    msg.innerText = "Server error";
  }
}
</script>

</body>
</html>
