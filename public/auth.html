<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Login / Signup | LUCCI</title>
  <link rel="stylesheet" href="style.css" />

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .auth-box {
      background: #fff;
      padding: 30px;
      width: 350px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 10px;
      margin-bottom: 12px;
    }

    button {
      width: 100%;
      padding: 10px;
      background: black;
      color: white;
      border: none;
      cursor: pointer;
    }

    .msg {
      text-align: center;
      margin-top: 10px;
      font-size: 14px;
    }

    hr {
      margin: 25px 0;
    }
  </style>
</head>
<body>

<div class="auth-box">
  <h2>Sign Up</h2>
  <input id="regName" placeholder="Name" />
  <input id="regEmail" placeholder="Email" />
  <input id="regPassword" type="password" placeholder="Password" />
  <button onclick="register()">Register</button>

  <div class="msg" id="registerMsg"></div>

  <hr>

  <h2>Login</h2>
  <input id="loginEmail" placeholder="Email" />
  <input id="loginPassword" type="password" placeholder="Password" />
  <button onclick="login()">Login</button>

  <div class="msg" id="loginMsg"></div>
</div>

<script src="auth.js"></script>
</body>
</html>
