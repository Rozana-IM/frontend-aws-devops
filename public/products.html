<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<title>LUCCI Products</title>

<link rel="stylesheet" href="style.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>

<body>

<!-- NAVBAR -->
<div id="navbar"></div>

<!-- SIDE MENU -->
<div id="sideMenu" class="side-menu">

<div class="menu-header">
<i class="fa-solid fa-xmark close-menu" onclick="openMenu()"></i>
</div>

<div class="menu-content">

<a href="collections.html?cat=men">Men</a>
<a href="collections.html?cat=women">Women</a>
<a href="collections.html?cat=children">Children</a>
<a href="collections.html?cat=bags">Handbags</a>
<a href="collections.html?cat=jewellery">Jewellery & Watches</a>
<a href="collections.html?cat=new">New In</a>
<a href="collections.html?cat=travel">Travel</a>
<a href="collections.html?cat=gifts">Gifts</a>

<hr>

<a href="profile.html" class="underline">Sign In</a>
<a href="index.html#about" class="underline">About Us</a>
<a href="contactus.html" class="underline">Contact Us</a>

</div>
</div>

<!-- HERO SECTION -->

<section id="heroSection" class="products-hero"
style="background-image:url('https://cdn.rozana-projects.online/Product_Hero.jpg')">

<div class="hero-arrow-left" onclick="goHome()">
<i class="fa-solid fa-arrow-left"></i>
</div>

<button class="collection-btn" onclick="scrollCollections()">
View My Collections
</button>

</section>

<!-- COLLECTIONS -->

<section id="collections" class="collections">

<h2>Explore Collections</h2>

<div class="collections-grid">

<div class="collection-card" onclick="openCollection('women')">
<img id="womenImg" src="https://cdn.rozana-projects.online/women/Women.jpg">
<p>Women</p>
</div>

<div class="collection-card" onclick="openCollection('men')">
<img id="menImg" src="https://cdn.rozana-projects.online/men/Men.jpg">
<p>Men</p>
</div>

<div class="collection-card" onclick="openCollection('jewellery')">
<img id="jewelleryImg" src="https://cdn.rozana-projects.online/jewellery/J.jpg">
<p>Jewellery</p>
</div>

<div class="collection-card" onclick="openCollection('bags')">
<img id="bagsImg" src="https://cdn.rozana-projects.online/bags/Bags.jpg">
<p>Bags</p>
</div>

</div>

</section>

<!-- JS FILES -->

<script src="../src/navbar.js"></script>
<script src="../src/app.js"></script>

<script>

/* CDN BASE */

const CDN = "https://cdn.rozana-projects.online";

/* HERO IMAGE */

document.getElementById("heroSection").style.backgroundImage =
`url(${CDN}/Product_Hero.jpg)`;

/* COLLECTION IMAGES */

document.getElementById("womenImg").src = `${CDN}/women/Women.jpg`;
document.getElementById("menImg").src = `${CDN}/men/Men.jpg`;
document.getElementById("jewelleryImg").src = `${CDN}/jewellery/J.jpg`;
document.getElementById("bagsImg").src = `${CDN}/bags/Bags.jpg`;

/* NAVIGATION */

function goHome(){
window.location = "index.html";
}

function scrollCollections(){
document.getElementById("collections")
.scrollIntoView({behavior:"smooth"});
}

function openCollection(category){
window.location = `collections.html?cat=${category}`;
}

/* LOAD NAVBAR */

fetch("components/navbar.html")
.then(res => res.text())
.then(data => {
document.getElementById("navbar").innerHTML = data;
initNavbar();
});

</script>

</body>
</html>
