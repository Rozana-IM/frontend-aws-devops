<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<title>LUCCI Products</title>

<link rel="stylesheet" href="style.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>

<body>

<!-- NAVBAR -->
<div id="navbar"></div>


<!-- SIDE MENU -->
<div id="sideMenu" class="side-menu">

<div class="menu-header">
<i class="fa-solid fa-xmark close-menu" onclick="openMenu()"></i>
</div>

<div class="menu-content">

<a href="collections.html?cat=men">Men</a>
<a href="collections.html?cat=women">Women</a>
<a href="collections.html?cat=children">Children</a>
<a href="collections.html?cat=bags">Handbags</a>
<a href="collections.html?cat=jewellery">Jewellery & Watches</a>
<a href="collections.html?cat=new">New In</a>
<a href="collections.html?cat=travel">Travel</a>
<a href="collections.html?cat=gifts">Gifts</a>

<hr>

<a href="profile.html" class="underline">Sign In</a>
<a href="index.html#about" class="underline">About Us</a>
<a href="contactus.html" class="underline">Contact Us</a>

</div>

</div>


<!-- HERO SECTION -->

<section class="products-hero"
style="background-image:url('https://d3402gddkhk6op.cloudfront.net/products-hero/Product_Hero.jpg')"
<div class="hero-arrow-left" onclick="goHome()">
<i class="fa-solid fa-arrow-left"></i>
</div>

<button class="collection-btn" onclick="scrollCollections()">
View My Collections
</button>

</section>


<!-- COLLECTIONS -->

<section id="collections" class="collections">

<h2>Explore Collections</h2>

<div class="collections-grid">

<div class="collection-card" onclick="openCollection('women')">
<img src="https://d3402gddkhk6op.cloudfront.net/LUCCI+IMAGES/women/Women.jpg">
<p>Women</p>
</div>

<div class="collection-card" onclick="openCollection('men')">
<img src="https://d3402gddkhk6op.cloudfront.net/LUCCI+IMAGES/men/Men.jpg">
<p>Men</p>
</div>

<div class="collection-card" onclick="openCollection('jewellery')">
<img src="https://d3402gddkhk6op.cloudfront.net/LUCCI+IMAGES/jewellery/J.jpg">
<p>Jewellery</p>
</div>

<div class="collection-card" onclick="openCollection('bags')">
<img src="https://d3402gddkhk6op.cloudfront.net/LUCCI+IMAGES/bags/Bags.jpg">
<p>Bags</p>
</div>

</div>

</section>


<!-- JS FILES -->

<script src="../src/navbar.js"></script>
<script src="../src/app.js"></script>

<script>

/* GO BACK HOME */

function goHome(){
window.location="index.html"
}


/* SCROLL COLLECTIONS */

function scrollCollections(){
document.getElementById("collections")
.scrollIntoView({behavior:"smooth"})
}


/* LOAD NAVBAR COMPONENT */

fetch("components/navbar.html")
.then(res => res.text())
.then(data => {

document.getElementById("navbar").innerHTML = data

initNavbar()

/* FORCE LUCCI LOGO VISIBLE */

const logo = document.getElementById("navLogo")
if(logo){
logo.classList.add("show")
}

})


/* OPEN COLLECTION */

function openCollection(category){
window.location = `collections.html?cat=${category}`
}

</script>

</body>
</html>
