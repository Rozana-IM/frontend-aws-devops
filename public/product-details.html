<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<title>LUCCI Product</title>

<link rel="stylesheet" href="style.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>

<body>

<!-- NAVBAR -->
<div id="navbar"></div>
<div id="toast"></div>
<section class="product-details">

<div class="product-container">

<div class="product-image">
<img id="productImage" alt="Product Image">
</div>

<div class="product-info">

<h1 id="productName"></h1>

<p class="price" id="productPrice"></p>

<p id="productDescription"></p>

<div class="product-actions">

  <button class="add-cart" onclick="addToCart()">
    <i class="fa-solid fa-bag-shopping"></i>
    Add To Cart
  </button>

  <button class="buy-now" onclick="buyNow()">
    Buy Now
  </button>

  <button class="wishlist" onclick="toggleWishlist()" id="wishlistBtn">
    <i class="fa-regular fa-heart"></i>
  </button>

</div>

</div>

</div>

</section>

<script src="/src/navbar.js"></script>

<script>

const API = "https://api.rozana-projects.online";

/* ================================
LOAD NAVBAR COMPONENT
================================ */

fetch("components/navbar.html")
.then(res => res.text())
.then(data => {

document.getElementById("navbar").innerHTML = data;

if(typeof initNavbar === "function"){
initNavbar();
}

});


/* ================================
GET PRODUCT ID
================================ */

const params = new URLSearchParams(window.location.search);
const id = params.get("id");

function getProductData() {
  return {
    id: id,
    name: document.getElementById("productName").innerText,
    price: Number(document.getElementById("productPrice").innerText.replace("₹","")),
    image: document.getElementById("productImage").src,
    quantity: 1
  };
}
/* ================================
LOAD PRODUCT (PUBLIC → KEEP FETCH)
================================ */

fetch(`${API}/products/${id}`)
.then(res => res.json())
.then(product => {

if(!product){
alert("Product not found");
window.location = "products.html";
return;
}

document.getElementById("productImage").src = product.image_url;
document.getElementById("productName").innerText = product.name;
document.getElementById("productPrice").innerText = "₹" + product.price;
document.getElementById("productDescription").innerText =
product.description || "Premium LUCCI product.";

updateWishlistIcon();

})
.catch(err => {

console.error(err);
alert("Failed to load product");

});


/* ================================
WISHLIST
================================ */

function toggleWishlist(){

let list = JSON.parse(localStorage.getItem("wishlist")) || [];

let index = list.indexOf(id);

if(index === -1){

list.push(id);

}else{

list.splice(index,1);

}

localStorage.setItem("wishlist", JSON.stringify(list));

updateWishlistIcon();

}


function updateWishlistIcon(){

let list = JSON.parse(localStorage.getItem("wishlist")) || [];

let btn = document.getElementById("wishlistBtn");

if(list.includes(id)){

btn.innerHTML = '<i class="fa-solid fa-heart" style="color:red;"></i>';

}else{

btn.innerHTML = '<i class="fa-regular fa-heart"></i>';

}

}


/* ================================
ADD TO CART
================================ */
function addToCart(){

  let cart = JSON.parse(localStorage.getItem("cart")) || [];
  const product = getProductData();

  let existing = cart.find(p => p.id == product.id);

  if(existing){
    existing.quantity += 1;
  } else {
    cart.push(product);
  }

  localStorage.setItem("cart", JSON.stringify(cart));

  if(typeof updateCartCount === "function"){
    updateCartCount();
  }

  // ✅ CHANGE BUTTON TO "VIEW CART"
  const btn = document.querySelector(".add-cart");
  btn.innerText = "View Cart";
  btn.onclick = () => window.location = "cart.html";

  // ✅ SHOW TOAST MESSAGE
  showToast("Added to Bag 👜");
}
/* ================================
   BUY NOW
================================ */

 function buyNow(){

  const product = getProductData();

  // ✅ Store temp checkout item
  localStorage.setItem("buyNowItem", JSON.stringify(product));

  // 👉 Redirect to checkout
  window.location = "checkout.html?type=buyNow";
}  

/* ================================
      TOAST BUTTON
================================ */

 function showToast(message){
  let toast = document.getElementById("toast");

  toast.innerText = message;
  toast.classList.add("show");

  setTimeout(() => {
    toast.classList.remove("show");
  }, 2000);
} 
</script>

</body>
</html>
