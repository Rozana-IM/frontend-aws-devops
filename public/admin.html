<!DOCTYPE html>
<html>
<head>
  <title>Admin Dashboard</title>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: linear-gradient(90deg,#1e2a38,#2c3e50);
      color: white;
      text-align: center;
    }

    h1 {
      margin-top: 40px;
    }

    .container {
      display: flex;
      justify-content: center;
      gap: 40px;
      margin-top: 40px;
    }

    .card {
      background: #3b4a5a;
      padding: 30px;
      border-radius: 10px;
      width: 260px;
    }

    button {
      background: orange;
      border: none;
      padding: 10px 20px;
      font-weight: bold;
      cursor: pointer;
      border-radius: 5px;
      margin-top: 10px;
    }

    #responseBox {
      margin: 40px auto;
      width: 80%;
      background: #4a5a6a;
      padding: 20px;
      border-radius: 8px;
      text-align: left;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
      color: black;
    }

    th, td {
      padding: 10px;
      border: 1px solid #ddd;
    }

    th {
      background: #2c3e50;
      color: white;
    }
  </style>
</head>

<body>

<h1>Dev / Microservices Dashboard</h1>

<div class="container">

  <div class="card">
    <h3>User Service</h3>
    <p>Manages users and profiles</p>
    <button onclick="loadUsers()">Load Users</button>
  </div>

  <div class="card">
    <h3>Order Service</h3>
    <p>Handles order lifecycle</p>
    <button onclick="loadOrders()">Load Orders</button>
  </div>

</div>
  <div id="healthBox"></div>

<div id="responseBox">
  Service responses appear here
</div>

<script>

const USER_API = "https://api.rozana-projects.online";
const ORDER_API = "https://api.rozana-projects.online";

/* LOAD USERS */

async function loadUsers() {
  try {
    const res = await fetch(`${USER_API}/users`);
    const data = await res.json();
    renderTable(data, "Users List");
  } catch (err) {
    document.getElementById("responseBox").innerHTML =
      "❌ Failed to load users";
  }
}

/* LOAD ORDERS */

async function loadOrders() {
  try {
    const res = await fetch(`${ORDER_API}/orders`);
    const data = await res.json();
    renderTable(data, "Orders List");
  } catch (err) {
    document.getElementById("responseBox").innerHTML =
      "❌ Failed to load orders";
  }
}

  /* LOAD HEALTH */
  async function loadHealth() {

  const results = await checkServiceHealth();

  let html = "<h3>Service Health</h3>";

  results.forEach(s => {
    html += `<p>${s.ok ? "🟢" : "🔴"} ${s.name}</p>`;
  });

  document.getElementById("healthBox").innerHTML = html;
}

loadHealth();

/* TABLE RENDER */

function renderTable(data, title) {

  if (!data || data.length === 0) {
    document.getElementById("responseBox").innerHTML =
      "No data available";
    return;
  }

  let html = `<h3>${title}</h3><table><tr>`;

  Object.keys(data[0]).forEach(key => {
    html += `<th>${key}</th>`;
  });

  html += "</tr>";

  data.forEach(item => {
    html += "<tr>";
    Object.values(item).forEach(val => {
      html += `<td>${val}</td>`;
    });
    html += "</tr>";
  });

  html += "</table>";

  document.getElementById("responseBox").innerHTML = html;
}

</script>

</body>
</html>
