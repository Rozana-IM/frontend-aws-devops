<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
<title>Admin Dashboard</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:linear-gradient(90deg,#1e2a38,#2c3e50);
  color:white;
  text-align:center;
}

h1{ margin-top:40px; }

.container{
  display:flex;
  justify-content:center;
  gap:40px;
  margin-top:40px;
}

.card{
  background:#3b4a5a;
  padding:30px;
  border-radius:10px;
  width:260px;
}

button{
  background:orange;
  border:none;
  padding:10px 20px;
  font-weight:bold;
  cursor:pointer;
  border-radius:5px;
}

#responseBox{
  margin:40px auto;
  width:80%;
  background:#4a5a6a;
  padding:20px;
  border-radius:8px;
  text-align:left;
}

table{
  width:100%;
  border-collapse:collapse;
  background:white;
  color:black;
}

th,td{
  padding:10px;
  border:1px solid #ddd;
}

th{
  background:#2c3e50;
  color:white;
}
</style>
</head>

<body>

<h1>Dev / Microservices Dashboard</h1>

<div class="container">

<div class="card">
  <h3>User Service</h3>
  <p>Manages users and profiles</p>
  <button onclick="loadUsers()">Load Users</button>
</div>

<div class="card">
  <h3>Order Service</h3>
  <p>Handles order lifecycle</p>
  <button onclick="loadOrders()">Load Orders</button>
</div>

</div>

<div id="healthBox"></div>

<div id="responseBox">
Service responses appear here
</div>

<!-- ✅ GLOBAL AUTH + SAFE FETCH -->
<script src="../src/app.js"></script>

<script>

/* ================= AUTH ================= */

const API = "https://api.rozana-projects.online";

function getUser(){
  return JSON.parse(localStorage.getItem("user"));
}

const user = getUser();

if (!user || user.role !== "admin") {
  alert("Admin access only");
  window.location.href = "index.html";
}

/* ================= SAFE FETCH ================= */

async function safeFetch(url) {
  try {
    const token = localStorage.getItem("token");

    const res = await fetch(url, {
      headers: {
        "Content-Type": "application/json",
        "Authorization": `Bearer ${token}`
      }
    });

    if (!res.ok) throw new Error("Request failed");

    return await res.json();

  } catch (err) {
    console.error(err);
    return null;
  }
}

/* ================= LOAD USERS ================= */

async function loadUsers() {

  const data = await safeFetch(`${API}/users`);

  if (!data) {
    responseBox.innerHTML = "❌ Failed to load users";
    return;
  }

  renderTable(data, "Users List");
}

/* ================= LOAD ORDERS ================= */

async function loadOrders() {

  // ✅ IMPORTANT FIX HERE
const data = await safeFetch(`${API}/orders/admin/all`);
  if (!data) {
    responseBox.innerHTML = "❌ Failed to load orders";
    return;
  }

  renderTable(data, "Orders List");
}

/* ================= HEALTH ================= */

async function loadHealth(){

  const services = [
    { name:"User Service", url:`${API}/health` },
    { name:"Order Service", url:`${API}/orders/health` } // ✅ FIX
  ];

  let html = "<h3>Service Health</h3>";

  for (const s of services){
    try{
      const r = await fetch(s.url);
      html += `<p>${r.ok ? "🟢" : "🔴"} ${s.name}</p>`;
    } catch {
      html += `<p>🔴 ${s.name}</p>`;
    }
  }

  document.getElementById("healthBox").innerHTML = html;
}

loadHealth();

/* ================= TABLE ================= */

function renderTable(data, title){

  if (!data || data.length === 0){
    responseBox.innerHTML = "No data available";
    return;
  }

  let html = `<h3>${title}</h3><table><tr>`;

  Object.keys(data[0]).forEach(key=>{
    html += `<th>${key}</th>`;
  });

  html += "</tr>";

  data.forEach(item=>{
    html += "<tr>";
    Object.values(item).forEach(val=>{
      html += `<td>${val}</td>`;
    });
    html += "</tr>";
  });

  html += "</table>";

  responseBox.innerHTML = html;
}

</script>
