<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>LUCCI Admin Dashboard</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:linear-gradient(90deg,#1e2a38,#2c3e50);
  color:white;
  text-align:center;
}

h1{ margin-top:30px; }

.container{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:20px;
  margin-top:30px;
}

.card{
  background:#3b4a5a;
  padding:20px;
  border-radius:10px;
  width:260px;
}

button{
  background:orange;
  border:none;
  padding:10px;
  margin-top:10px;
  width:100%;
  font-weight:bold;
  cursor:pointer;
  border-radius:5px;
}

#responseBox{
  margin:30px auto;
  width:90%;
  background:#4a5a6a;
  padding:20px;
  border-radius:8px;
  text-align:left;
  overflow:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  background:white;
  color:black;
}

th,td{
  padding:10px;
  border:1px solid #ddd;
}

th{
  background:#2c3e50;
  color:white;
}

input,select{
  padding:8px;
  margin:5px;
  border-radius:5px;
  border:none;
}
</style>
</head>

<body>

<h1>🔥 LUCCI Admin Dashboard</h1>

<div class="container">

<!-- USERS -->
<div class="card">
  <h3>User Service</h3>
  <button onclick="loadUsers()">View Users</button>
</div>

<!-- ORDERS -->
<div class="card">
  <h3>Order Service</h3>
  <button onclick="loadOrders()">View Orders</button>
</div>

<!-- UPDATE ORDER -->
<div class="card">
  <h3>Update Order</h3>

  <input id="orderId" placeholder="Order ID">
  
  <select id="orderStatus">
    <option value="PENDING">PENDING</option>
    <option value="PAID">PAID</option>
    <option value="SHIPPED">SHIPPED</option>
    <option value="DELIVERED">DELIVERED</option>
  </select>

  <button onclick="updateOrder()">Update Status</button>
</div>

<!-- PRODUCTS -->
<div class="card">
  <h3>Product Service</h3>
  <button onclick="loadProducts()">View Products</button>
</div>

<!-- ADD PRODUCT -->
<div class="card">
  <h3>Add Product</h3>

  <input id="pname" placeholder="Name">
  <input id="pprice" placeholder="Price">
  <input id="pimage" placeholder="Image URL">
  <input id="pcategory" placeholder="Category">

  <button onclick="addProduct()">Add Product</button>
</div>

</div>

<div id="healthBox"></div>

<div id="responseBox">
Admin responses appear here
</div>

<script src="../src/app.js"></script>

<script>

const API = "https://api.rozana-projects.online";

/* ================= AUTH ================= */

function getUser(){
  return JSON.parse(localStorage.getItem("user"));
}

const user = getUser();

if (!user || user.role !== "admin") {
  alert("Admin access only");
  window.location.href = "index.html";
}

/* ================= SAFE FETCH ================= */

async function safeFetch(url, options = {}) {
  try {
    const token = localStorage.getItem("token");

    const res = await fetch(url, {
      method: options.method || "GET",
      headers: {
        "Content-Type": "application/json",
        "Authorization": `Bearer ${token}`
      },
      body: options.body
    });

    if (res.status === 401) {
      alert("Session expired. Login again.");
      localStorage.clear();
      window.location = "profile.html";
      return null;
    }

    if (res.status === 404) {
      console.error("❌ API not found:", url);
      return null;
    }

    if (!res.ok) {
      console.error("❌ API error:", res.status);
      return null;
    }

    return await res.json();

  } catch (err) {
    console.error("❌ Fetch error:", err);
    return null;
  }
}

/* ================= USERS ================= */

async function loadUsers() {

  // 🔥 FIXED (try both if needed)
  const data = await safeFetch(`${API}/users/all`);

  if (!data) {
    responseBox.innerHTML = "❌ Failed to load users";
    return;
  }

  renderTable(data, "Users List");
}

/* ================= ORDERS ================= */

async function loadOrders() {

  const data = await safeFetch(`${API}/orders/admin/all`);

  if (!data) {
    responseBox.innerHTML = "❌ Failed to load orders";
    return;
  }

  renderTable(data, "Orders List");
}

/* ================= UPDATE ORDER ================= */

async function updateOrder(){

  const id = document.getElementById("orderId").value;
  const status = document.getElementById("orderStatus").value;

  const res = await safeFetch(`${API}/orders/update-status`, {
    method:"PUT",
    body: JSON.stringify({
      orderId:id,
      status:status,
      paymentId:null
    })
  });

  responseBox.innerHTML = "✅ Order Updated";
}

/* ================= PRODUCTS ================= */

async function loadProducts(){

  // 🔥 IMPORTANT FIX
  const data = await safeFetch(`${API}/products/`);

  if (!data) {
    responseBox.innerHTML = "❌ Failed to load products";
    return;
  }

  renderTable(data, "Products");
}

/* ================= ADD PRODUCT ================= */

async function addProduct(){

  const product = {
    name: pname.value,
    price: pprice.value,
    image_url: pimage.value,
    category: pcategory.value
  };

  const res = await safeFetch(`${API}/products/`, {
    method:"POST",
    body: JSON.stringify(product)
  });

  responseBox.innerHTML = "✅ Product Added";
}

/* ================= HEALTH ================= */

async function loadHealth(){

  const services = [
    { name:"User Service", url:`${API}/health` },
    { name:"Order Service", url:`${API}/orders/health` },
    { name:"Product Service", url:`${API}/products/health` },
    { name:"Payment Service", url:`${API}/payments/health` }
  ];

  let html = "<h3>Service Health</h3>";

  for (const s of services){
    try{
      const r = await fetch(s.url);
      html += `<p>${r.ok ? "🟢" : "🔴"} ${s.name}</p>`;
    } catch {
      html += `<p>🔴 ${s.name}</p>`;
    }
  }

  document.getElementById("healthBox").innerHTML = html;
}

loadHealth();

/* ================= TABLE ================= */

function renderTable(data, title){

  if (!data || !Array.isArray(data) || data.length === 0){
    responseBox.innerHTML = "<p>No data available</p>";
    return;
  }

  let html = `<h3>${title}</h3><table><tr>`;

  Object.keys(data[0]).forEach(key=>{
    html += `<th>${key}</th>`;
  });

  html += "</tr>";

  data.forEach(item=>{
    html += "<tr>";
    Object.values(item).forEach(val=>{
      html += `<td>${val}</td>`;
    });
    html += "</tr>";
  });

  html += "</table>";

  responseBox.innerHTML = html;
}

</script>

</body>
</html>
