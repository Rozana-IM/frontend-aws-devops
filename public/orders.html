<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<title>My Orders | LUCCI</title>
<link rel="stylesheet" href="style.css">
  <link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

<div id="navbar"></div>

<section class="orders-page">
<h2>My Orders</h2>
<div id="orders"></div>
</section>

<!-- LOAD NAVBAR -->
<script src="src/navbar.js"></script>

<!-- APP FUNCTIONS -->
<script src="src/app.js"></script>

<script>

const API = "https://api.rozana-projects.online";

/* ================= SAFE FETCH ================= */
async function safeFetch(url, options = {}) {
  try {
    const token = localStorage.getItem("token");

    const res = await fetch(url, {
      method: options.method || "GET",
      headers: {
  "Content-Type": "application/json",
  ...(token && { "Authorization": `Bearer ${token}` })
},
      body: options.body
    });

    if (res.status === 401) {
      alert("Session expired. Login again.");
      localStorage.clear();
      window.location = "profile.html";
      return null;
    }

    if (!res.ok) {
      console.error("❌ API error:", res.status);
      return null;
    }

    return await res.json();

  } catch (err) {
    console.error("❌ Fetch error:", err);
    return null;
  }
}

/* ================= LOAD NAVBAR ================= */
fetch("components/navbar.html")
.then(res => res.text())
.then(data => {
  document.getElementById("navbar").innerHTML = data;
  if (typeof initNavbar === "function") {
    initNavbar();
  }
});

/* ================= REQUIRE LOGIN ================= */
function requireLogin() {
  const token = localStorage.getItem("token");

  if (!token) {
    alert("Please login first");
    window.location = "profile.html";
    return false;
  }
  return true;
}

/* ================= FETCH ORDERS ================= */
async function fetchUserOrders() {
  return await safeFetch(`${API}/orders`);
}

/* ================= LOAD ORDERS ================= */
document.addEventListener("DOMContentLoaded", async () => {

  if (!requireLogin()) return;

  const orders = await fetchUserOrders();
  console.log("📦 Orders:", orders);

  const container = document.getElementById("orders");
  container.innerHTML = "";

  if (!orders || !Array.isArray(orders) || orders.length === 0) {
    container.innerHTML = "<p>No orders found.</p>";
    return;
  }

  orders.forEach(order => {

    const div = document.createElement("div");
    div.className = "order-card";

    div.innerHTML = `
      <div class="order-preview">

        <img 
          src="${order.image_url || 'https://cdn.rozana-projects.online/placeholder.png'}"
          class="order-img"
          onerror="this.src='https://cdn.rozana-projects.online/placeholder.png'"
        >

        <div class="order-info">
          <p><b>${order.product_name || "Product"}</b></p>

          <p>
            Qty: ${order.quantity || 1}
          </p>

          <p>Total: ₹${order.total_amount}</p>
          <p>Status: ${order.status}</p>

          <p>
            Payment: 
            <span class="${order.payment_status === 'PAID' ? 'paid' : 'pending'}">
              ${order.payment_status}
            </span>
          </p>

          <p>
            Date: ${
              order.created_at 
              ? new Date(order.created_at).toLocaleDateString() 
              : "N/A"
            }
          </p>

          <button onclick="viewOrder(${order.id})">
            View Details
          </button>

        </div>

      </div>
    `;

    container.appendChild(div);
  });

});

/* ================= VIEW ORDER ================= */
function viewOrder(id){
  window.location = "order-details.html?id=" + id;
}

</script>

</body>
</html>
